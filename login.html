<!DOCTYPE html>
<html lang="en">

<head>
    <title>Fun Finds Geocaching Login</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html"><strong>Home</strong></a></li> |
                <li><a href="geocaches.html"><strong>Geocaches</strong></a></li> |
                <li><a href="login.html"><strong>Login</strong></a></li>
            </ul>
        </nav>
        <video controls autoplay loop muted class="logo-video">
            <source src="LogoAnimation.mp4"
                alt="Logo with map, compass, and treasure chest that opens showing treasure">
            <track kind="captions" label="Full Audio Captions" src="captions.vtt" srclang="en" default>
            <!-- image for browsers that don’t support mp4 -->
            <img src="FunFindsGeocachingLogo.png" srcset="FunFindsGeocachingLogo.png 1x,
                    FunFindsGeocachingLogo@2x.png 2x
                    FunFindsGeocachingLogo@3x.png 3x" class="logo" alt="Logo with map, compass, and treasure chest">
        </video>
    </header>
    <main>
        <form id="login-container">
            <h1>Login</h1>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@domain.com" required>
            </p>
            <p>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" required>
            </p>
            <button type="submit">Login</button>
            <p id="new-account">Don't have an account yet?</p>
            <button type="button">Create Account</button>
            <!-- maxlength="" pattern="" to require more secure password -->
        </form>
    </main>
    <footer>
        <!-- May add something later -->
    </footer>
</body>

</html>
