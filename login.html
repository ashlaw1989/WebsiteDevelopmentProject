<!DOCTYPE html>
<html lang="en">

<head>
    <title>Fun Finds Geocaching Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }
    </script>
</head>

<body>
    <header>
        <div class="nav-container">
            <!-- Hamburger menu for mobile -->
            <div class="hamburger" onclick="toggleMenu()">
                <div></div>
                <div></div>
                <div></div>
            </div>

            <nav id="navLinks">
                <ul>
                    <li><a href="index.html"><strong>Home</strong></a></li>
                    <li><a href="geocaches.html"><strong>Geocaches</strong></a></li>
                    <li><a href="login.html"><strong>Login</strong></a></li>
                    <li><a href="about.html"><strong>About</strong></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="logo-wrapper">
        <video autoplay loop controls muted class="logo-video">
            <source src="LogoAnimation.mp4" type="video/mp4">
            <track kind="captions" label="Full Audio Captions" src="captions.vtt" srclang="en" default>
            <!-- Fallback image -->
            <img src="FunFindsGeocachingLogo.png" srcset="FunFindsGeocachingLogo.png 1x,
                 FunFindsGeocachingLogo@2x.png 2x,
                 FunFindsGeocachingLogo@3x.png 3x" alt="Logo with map, compass, and treasure chest" class="logo">
        </video>
    </div>


    <main>
        <form id="login-container">
            <h1>Login</h1>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@domain.com" required>
            </p>
            <p>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password"
                    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{10,18}$" required>
            </p>
            <button type="submit">Login</button>
            <p id="new-account">Don't have an account yet?</p>
            <a class="btn modal-trigger" href="#modal-signup" type="button">Create Account</a>
        </form>
        <script src="login.js"></script>
    </main>
    <footer>
        Questions? Comments? Concerns?
        <a href="mailto:ashleytessamom@yahoo.com">Contact Me</a>
    </footer>

    <!-- create account popup -->
    <div id="modal-signup" class="modal">
        <div class="modal-content">
            <h1>Sign up</h1>
            <br>
            <form id="signup-form">
                <div class="input-field">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="example@domain.com" required>
                </div>
                <div class="input-field">
                    <label for="signup-password">New password</label>
                    <input type="password" id="signup-password" placeholder="P@ssw0rd" required>
                </div>
                <p>Password must be 10 - 18 characters and contain:</p>
                <ul class="password-list">
                    <li>One lowercase</li>
                    <li>One uppercase</li>
                    <li>One number</li>
                    <li>One special character</li>
                </ul>
                <button type="button" class="cancel" id="cancel">Cancel</button>
                <button class="signup" id="signup">Sign up</button>
            </form>
        </div>
    </div>


    <script type="module">
        // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDQSZC4wdowd4N9Ez7sd5G4hzrT_NwNsSI",
        authDomain: "website-development-fall-2025.firebaseapp.com",
        projectId: "website-development-fall-2025",
        appId: "1:490461443020:web:8117ce052b08b348cd6369"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);

    // expose to auth.js
    window.auth = auth;
    </script>

    <script src="auth.js"></script>
    <script src="index.js"></script>
</body>

</html>
