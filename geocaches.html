<!DOCTYPE html>
<html lang="en">

<head>
    <title>Fun Finds Geocaching Geocaches</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <header>
        <div class="nav-container">
            <div class="hamburger" onclick="toggleMenu()">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <nav id="navLinks">
                <ul>
                    <li><a href="index.html"><strong>Home</strong></a></li>
                    <li><a href="geocaches.html"><strong>Geocaches</strong></a></li>
                    <li><a href="about.html"><strong>About</strong></a></li>
                    <li><a href="login.html"><strong>Login</strong></a></li>
                    <li><a href="#" id="logout"><strong>Logout</strong></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="logo-wrapper">
        <img src="FunFindsGeocachingLogo.png" alt="Logo with map, compass, and treasure chest" class="logo">
    </div>

    <main>
        <h1 id="geacache-heading">Geocache Sites</h1>
        <section id="geocaches">
            <ul>
                <li id="geocache1">
                    <p id="forest">
                        <strong>Easy Forest</strong>
                        <button class="start" id="start-ef">START</button>
                    </p>
                </li>
                <li id="geocache2">
                    <p id="park">
                        <strong>Easy Park</strong>
                        <button class="start" id="start-ep">START</button>
                    </p>
                </li>
                <li id="geocache3">
                    <p id="city">
                        <strong>Medium City</strong>
                        <button class="start" id="start-mc">START</button>
                    </p>
                </li>
                <li id="geocache4">
                    <p id="forest">
                        <strong>Medium Forest</strong>
                        <button class="start" id="start-mf">START</button>
                    </p>
                </li>
                <li id="geocache5">
                    <p id="park">
                        <strong>Hard Park</strong>
                        <button class="start" id="start-hp">START</button>
                    </p>
                </li>
                <li id="geocache6">
                    <p id="city">
                        <strong>Hard City</strong>
                        <button class="start" id="start-hc">START</button>
                    </p>
                </li>
            </ul>
        </section>
    </main>
    <footer>
        Questions? Comments? Concerns?
        <a href="mailto:ashleytessamom@yahoo.com">Contact Me</a>
    </footer>

    <!-- popup elements -->
    <div class="popup-container" id="popup-container">
        <div class="popup-box">
            <h1>Adventure awaits!</h1>
            <p><a id="login-message" href="login.html?signup=true">Login or create an account to get started</a></p>
            <div id="map"></div>
            <button class="close" id="close">Close</button>
        </div>
    </div>

    <!-- logout element -->
    <div class="popup-container" id="logout-popup">
        <div class="popup-box">
            <h1>You have been logged out.</h1>
            <button class="close" id="close-logout">Close</button>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module" src="map.js"></script>

</body>

</html>
